[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "finbot"
version = "0.1.0"
description = "Intent-classification chatbot for fintech customer support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Azimml" }]
keywords = ["chatbot", "nlp", "fintech", "tensorflow", "intent-classification"]
dependencies = [
    "nltk>=3.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
model = ["tensorflow>=2.13", "keras>=2.13"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
finbot = "finbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["finbot"]
